<div class="exp-card" data-exp-number="{% if exp.number > 39 %}{{ exp.number|add:'-1' }}{% else %}{{ exp.number }}{% endif %}">
    <div class="exp-info">
        <span class="exp-number">Experiment #{% if exp.number > 39 %}{{ exp.number|add:'-1' }}{% else %}{{ exp.number }}{% endif %}</span>
        <h3 class="exp-name">{{ exp.name }}</h3>
    </div>
    <div class="exp-actions">
        <span class="status-tag">ACTIVE</span>
        <a href="/experiment/{{ exp.slug }}/" class="premium-btn btn-run">
            Run ⚡
        </a>
    </div>
</div>

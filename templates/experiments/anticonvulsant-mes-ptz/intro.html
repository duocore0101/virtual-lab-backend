{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <script>(function () { const t = localStorage.getItem('gmars-theme-preference'); if (t === 'light') document.body.classList.add('light-mode'); })();</script>
  <meta charset="UTF-8">
  <title>
    Anticonvulsant Activity by Maximal Electroshock Seizure (MES) or PTZ Method
  </title>

  <!-- Reuse Rotarod / Actophotometer Intro CSS -->
  <link rel="stylesheet" href="{% static 'experiments/rotarod/css/intro.css' %}??v=10001">
  <style>
    /* 🔝 TOP RIGHT ACTIONS */
    .top-actions {
      position: fixed;
      top: 20px;
      right: 25px;
      display: flex;
      gap: 12px;
      z-index: 9999;
    }
</style>
</head>

<body>
  
<!-- 🔝 TOP RIGHT ACTIONS -->
  <div class="top-actions"></div>


  <div class="page-container">

    <h1 class="title">
      Aim
    </h1>

    <!-- =========================
       AIM CONTENT
  ========================== -->
    <div class="info-box">

      <p style="font-size:18px; text-align:justify; font-weight:500;">
        To study the Anticonvulsant Activity by Maximal Electroshock Seizure (MES) or PTZ Method.
      </p>
    </div>

    <!-- BUTTONS -->
    <div class="button-row">
      <button class="back-btn" onclick="location.href='{{ dashboard_url }}'">
        ⬅ Back
      </button>

      <button class="exp-btn" onclick="location.href='/experiment/{{ experiment.slug }}/requirements/'">
        Next: Requirements ▶
      </button>
    </div>

  </div>

  <!-- THEME TOGGLE -->
  

  <script>
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {
          alert("Fullscreen not supported");
        });
      } else {
        document.exitFullscreen();
      }
    }
  </script>


  <script src="{% static 'js/theme-toggle.js' %}?v=25"></script>
</body>

</html>

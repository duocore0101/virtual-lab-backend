{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <script>(function(){const t=localStorage.getItem('gmars-theme-preference');if(t==='light')document.body.classList.add('light-mode');})();</script>
  <meta charset="UTF-8">
  <title>Result Graph – Anticonvulsant Activity</title>

  <link rel="stylesheet"
        href="{% static 'experiments/rotarod/css/experiment.css' %}?v=10001">

  <!-- CHART.JS -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    /* =========================
       THEME VARIABLES
    ========================== */
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: radial-gradient(circle at top, #1a1a1a, #000000);
      color: #ffffff;
      transition: all 0.3s ease;
    }

    body.light-mode {
      background: #f4f6f9;
      color: #111;
    }

    /* =========================
       GRAPH CARD
    ========================== */
    .graph-card {
      max-width: 950px;
      margin: 40px auto;
      background: linear-gradient(135deg, #0f0f0f, #1b1b1b);
      padding: 35px 40px;
      border-radius: 16px;
      box-shadow: 0 0 25px rgba(255, 0, 0, 0.35);
      transition: all 0.3s ease;
    }

    body.light-mode .graph-card {
      background: #ffffff;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }

    .graph-title {
      text-align: center;
      font-size: 30px;
      font-weight: 700;
      margin-bottom: 5px;
      color: #ff4b4b;
    }

    body.light-mode .graph-title {
      color: #c62828;
    }

    .graph-subtitle {
      text-align: center;
      font-size: 18px;
      margin-bottom: 25px;
      color: #ddd;
    }

    body.light-mode .graph-subtitle {
      color: #555;
    }

    .group-labels {
      display: flex;
      justify-content: space-around;
      margin-top: 12px;
      font-weight: 600;
      color: #ffb3b3;
    }

    body.light-mode .group-labels {
      color: #333;
    }

    /* =========================
       THEME TOGGLE
    ========================== */
    .theme-toggle {
      position: absolute;
      top: 20px;
      right: 30px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .toggle-switch {
      position: relative;
      width: 52px;
      height: 26px;
    }

    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: #555;
      border-radius: 34px;
      transition: 0.4s;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 20px;
      width: 20px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      border-radius: 50%;
      transition: 0.4s;
    }

    input:checked + .slider {
      background-color: #ff4b4b;
    }

    input:checked + .slider:before {
      transform: translateX(26px);
    }

    .toggle-label {
      font-size: 14px;
      color: #ccc;
    }

    body.light-mode .toggle-label {
      color: #333;
    }

    /* ================= NAVIGATION BUTTONS THEME ================= */
    .back-btn-new {
      padding: 12px 40px;
      font-size: 18px;
      font-weight: 700;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      background: #fff;
      color: #ff2e2e;
      border: 2px solid #ff2e2e;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .back-btn-new:hover {
      background: #fff5f5;
      transform: translateY(-2px);
    }

    .next-btn-new {
      padding: 12px 40px;
      font-size: 18px;
      font-weight: 700;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      background: #ff4d4d;
      color: #fff;
      border: none;
      box-shadow: 0 0 20px rgba(255, 77, 77, 0.5);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .next-btn-new:hover {
      background: #ff2e2e;
      box-shadow: 0 0 30px rgba(255, 46, 46, 0.7);
      transform: translateY(-2px);
    }
  </style>
  <style>
    /* 🔝 TOP RIGHT ACTIONS */
    .top-actions {
      position: fixed;
      top: 20px;
      right: 25px;
      display: flex;
      gap: 12px;
      z-index: 9999;
    }
</style>
</head>

<body>
  <!-- 🎯 EXPERIMENT AIM HEADER -->
  <div class="top-left-aim">
    <span><b>Aim:</b> To study the Anticonvulsant Activity by Maximal Electroshock Seizure (MES) or PTZ Method.</span>
  </div>
<!-- 🔝 TOP RIGHT ACTIONS -->
  <div class="top-actions"></div>


  

  


<!-- 🌗 THEME TOGGLE -->


<div class="graph-card">

  <div class="graph-title">Result (Graph)</div>
  <div class="graph-subtitle">
    Anticonvulsant Activity by MES and PTZ Methods
  </div>

  <canvas id="resultChart" height="120"></canvas>

  <div class="group-labels">
    <span>MES Method</span>
    <span>PTZ Method</span>
  </div>

  <div class="button-row" style="display: flex; justify-content: center; margin-top: 30px; gap: 30px;">
    <button class="back-btn-new" onclick="location.href='/experiment/{{ experiment.slug }}/experiment2/'">
      <span style="font-size: 22px;">⬅</span> Back
    </button>

    <button class="next-btn-new" onclick="location.href='/experiment/{{ experiment.slug }}/conclusion/'">
      Next <span style="font-size: 22px;">▶</span>
    </button>
  </div>

</div>

<script>
/* =========================
   GRAPH DATA (PRACTICAL 9)
========================== */
/* MES: % Protection */
const mesValues = [0, 83.3, 66.7];

/* PTZ: % Protection */
const ptzValues = [0, 100, 66.7];

const values = [
  mesValues[0],
  mesValues[1],
  mesValues[2],
  ptzValues[0],
  ptzValues[1],
  ptzValues[2]
];

/* =========================
   BAR GRADIENTS
========================== */
const ctx = document.getElementById("resultChart").getContext("2d");

const redGrad = ctx.createLinearGradient(0, 0, 0, 300);
redGrad.addColorStop(0, "#ff6a6a");
redGrad.addColorStop(1, "#b71c1c");

const blueGrad = ctx.createLinearGradient(0, 0, 0, 300);
blueGrad.addColorStop(0, "#6aa9ff");
blueGrad.addColorStop(1, "#1e3c72");

/* =========================
   CHART
========================== */
new Chart(ctx, {
  type: "bar",
  data: {
    labels: [
      "Control",
      "Standard",
      "Test Drug",
      "Control",
      "Standard",
      "Test Drug"
    ],
    datasets: [{
      data: values,
      backgroundColor: [
        "#555",
        redGrad,
        blueGrad,
        "#555",
        redGrad,
        blueGrad
      ],
      borderRadius: 10,
      barThickness: 50
    }]
  },
  options: {
    plugins: {
      legend: { display: false }
    },
    scales: {
      y: {
        beginAtZero: true,
        max: 110,
        title: {
          display: true,
          text: "% Protection from Seizures"
        },
        grid: {
          color: "rgba(255,255,255,0.1)"
        }
      },
      x: {
        grid: { display: false }
      }
    }
  }
});
</script>


<script src="{% static 'js/theme-toggle-v2.js' %}?v=28"></script>
</body>
</html>

{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <script>(function () { const t = localStorage.getItem('gmars-theme-preference'); if (t === 'light') document.body.classList.add('light-mode'); })();</script>
  <meta charset="UTF-8">
  <title>Stereotyped Behavior – Graph</title>

  <link rel="stylesheet" href="{% static 'experiments/rotarod/css/intro.css' %}?v=10006">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    /* ================= PAGE CONTAINER ================= */
    .page-container {
      max-width: 1400px !important;
      width: 95%;
      margin: 0 auto;
    }

    /* ================= GRAPH CARD ================= */
    .graph-card {
      max-width: 900px;
      margin: 40px auto;
      background: #1e1e1e;
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    body.light-mode .graph-card {
      background: #ffffff;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      border-color: #eee;
    }

    .graph-title {
      text-align: center;
      font-size: 28px;
      font-weight: 700;
      color: #ff5252;
      margin-bottom: 5px;
    }

    .graph-subtitle {
      text-align: center;
      font-size: 16px;
      color: #aaa;
      margin-bottom: 30px;
    }

    body.light-mode .graph-subtitle {
      color: #666;
    }

    /* ================= NAVIGATION BUTTONS THEME ================= */
    .back-btn-new {
      padding: 12px 40px;
      font-size: 18px;
      font-weight: 700;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      background: #fff;
      color: #ff2e2e;
      border: 2px solid #ff2e2e;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .back-btn-new:hover {
      background: #fff5f5;
      transform: translateY(-2px);
    }

    .next-btn-new {
      padding: 12px 40px;
      font-size: 18px;
      font-weight: 700;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      background: #ff4d4d;
      color: #fff;
      border: none;
      box-shadow: 0 0 20px rgba(255, 77, 77, 0.5);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .next-btn-new:hover {
      background: #ff2e2e;
      box-shadow: 0 0 30px rgba(255, 46, 46, 0.7);
      transform: translateY(-2px);
    }

    /* ================= TOP ACTION BUTTONS ================= */
    .top-actions {
      position: fixed;
      top: 20px;
      right: 25px;
      z-index: 9999;
      display: flex;
      gap: 12px;
    }
  </style>
</head>

<body>
  <!-- 🎯 EXPERIMENT AIM HEADER -->
  <div class="top-left-aim">
    <span><b>Aim:</b> To study and evaluate stereotyped behavior produced by centrally acting drugs in rats/mice.</span>
  </div>

  <!-- 🔽 TOP RIGHT BUTTONS -->
  <div class="top-actions">
  </div>

  <div class="page-container">
    <h1 class="title">Result Analysis</h1>

    <div class="graph-card">
      <div class="graph-title">Effect of Apomorphine on Stereotyped Behavior</div>
      <div class="graph-subtitle">Mean Stereotypy Score: Baseline vs After Drug</div>

      <canvas id="stereotypyChart" height="130"></canvas>

      <div class="button-row" style="display: flex; justify-content: center; margin-top: 40px; gap: 30px;">
        <button class="back-btn-new" onclick="location.href='/experiment/{{ experiment.slug }}/experiment/'">
          <span style="font-size: 22px;">⬅</span> Back
        </button>

        <button class="next-btn-new" onclick="location.href='/experiment/{{ experiment.slug }}/conclusion/'">
          Next <span style="font-size: 22px;">▶</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    const data = JSON.parse(localStorage.getItem("stereotypy_data")) || { A: 1, B: 4 };
    const ctx = document.getElementById("stereotypyChart").getContext("2d");

    const blueGrad = ctx.createLinearGradient(0, 0, 0, 300);
    blueGrad.addColorStop(0, "#ff6a6a");
    blueGrad.addColorStop(1, "#b71c1c");

    new Chart(ctx, {
      type: "bar",
      data: {
        labels: ["Baseline (Before)", "After Apomorphine"],
        datasets: [{
          data: [data.A, data.B],
          backgroundColor: [blueGrad, blueGrad],
          borderRadius: 12,
          barThickness: 60
        }]
      },
      options: {
        plugins: {
          legend: { display: false }
        },
        scales: {
          y: {
            beginAtZero: true,
            max: 5,
            title: {
              display: true,
              text: "Stereotypy Score (0-4)"
            },
            grid: {
              color: "rgba(255,255,255,0.05)"
            }
          },
          x: {
            grid: { display: false }
          }
        }
      }
    });

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    }
  </script>

  <script src="{% static 'js/theme-toggle-v2.js' %}?v=27"></script>
</body>

</html>

{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <script>(function(){const t=localStorage.getItem('gmars-theme-preference');if(t==='light')document.body.classList.add('light-mode');})();</script>
  <meta charset="UTF-8">
  <title>Result Graph – Tail Flick Method</title>

  <link rel="stylesheet"
        href="{% static 'experiments/rotarod/css/experiment.css' %}?v=10001">

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: radial-gradient(circle at top, #1a1a1a, #000000);
      color: #ffffff;
      transition: all 0.3s ease;
    }

    body.light-mode {
      background: #f4f6f9;
      color: #111;
    }

    .graph-card {
      max-width: 1000px;
      margin: 40px auto;
      background: linear-gradient(135deg, #0f0f0f, #1b1b1b);
      padding: 35px 40px;
      border-radius: 16px;
      box-shadow: 0 0 25px rgba(255, 0, 0, 0.35);
      transition: all 0.3s ease;
    }

    body.light-mode .graph-card {
      background: #ffffff;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }

    .graph-title {
      text-align: center;
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 5px;
      color: #ff4b4b;
    }

    body.light-mode .graph-title {
      color: #c62828;
    }

    .graph-subtitle {
      text-align: center;
      font-size: 18px;
      margin-bottom: 25px;
      color: #ddd;
    }

    body.light-mode .graph-subtitle {
      color: #555;
    }

    .top-actions {
      position: absolute;
      top: 20px;
      right: 30px;
      display: flex;
      gap: 12px;
      z-index: 9999;
    }

    .button-row {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 30px;
    }

    .button-row button {
      padding: 10px 28px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 30px;
      border: 2px solid #ff2a2a;
      background: transparent;
      color: #ff2a2a;
      cursor: pointer;
      transition: all 0.35s ease;
    }

    .button-row button:hover {
      background: linear-gradient(135deg, #ff2a2a, #8b0000);
      color: #ffffff;
      box-shadow: 0 0 15px rgba(255, 0, 0, 0.6);
    }
  </style>
</head>

<body>
  <!-- 🎯 EXPERIMENT AIM HEADER -->
  <div class="top-left-aim">
    <span><b>Aim:</b> To Study and Evaluate Analgesic Activity by Tail Flick Method</span>
  </div>

  <div class="top-actions"></div><div class="graph-card">

  <div class="graph-title">Tail Flick Method – Analgesic Activity</div>
  <div class="graph-subtitle">Reaction Time (seconds) vs Time (minutes)</div>

  <canvas id="resultChart" height="120"></canvas>

  <div class="button-row">
    <button onclick="location.href='/experiment/{{ experiment.slug }}/run/'">
      ⬅ Back
    </button>
    <button onclick="location.href='/experiment/{{ experiment.slug }}/conclusion/'">
      Next ▶
    </button>
  </div>

</div>

<script>
/* TAIL FLICK GRAPH DATA */
const ctx = document.getElementById("resultChart").getContext("2d");

function getLabelColor() {
  return document.body.classList.contains("light-mode") ? "#222" : "#fff";
}

function getGridColor() {
  return document.body.classList.contains("light-mode") ? "rgba(0,0,0,0.1)" : "rgba(255,255,255,0.1)";
}

const tailFlickChart = new Chart(ctx, {
  type: "line",
  data: {
    labels: [0, 15, 30, 60, 90, 120],
    datasets: [
      {
        label: "Control",
        data: [4.1, 4.3, 4.3, 4.5, 4.1, 3.9],
        borderColor: "#1f77b4",
        backgroundColor: "#1f77b4",
        tension: 0.1,
        fill: false,
        pointRadius: 5
      },
      {
        label: "Morphine (5 mg/kg)",
        data: [4.0, 8.6, 11.1, 11.7, 9.4, 7.1],
        borderColor: "#ff7f0e",
        backgroundColor: "#ff7f0e",
        tension: 0.1,
        fill: false,
        pointRadius: 5
      }
    ]
  },
  options: {
    responsive: true,
    plugins: {
      legend: {
        labels: { color: getLabelColor() }
      }
    },
    scales: {
      y: {
        beginAtZero: false,
        ticks: { color: getLabelColor() },
        grid: { color: getGridColor() },
        title: {
          display: true,
          text: "Reaction Time (sec)",
          color: getLabelColor(),
          font: { weight: 'bold' }
        }
      },
      x: {
        ticks: { color: getLabelColor() },
        grid: { color: getGridColor() },
        title: {
          display: true,
          text: "Time (min)",
          color: getLabelColor(),
          font: { weight: 'bold' }
        }
      }
    }
  }
});

// Listen for global theme changes to update graph text dynamically
window.addEventListener("themeChanged", () => {
  tailFlickChart.options.plugins.legend.labels.color = getLabelColor();
  tailFlickChart.options.scales.x.ticks.color = getLabelColor();
  tailFlickChart.options.scales.x.title.color = getLabelColor();
  tailFlickChart.options.scales.x.grid.color = getGridColor();
  tailFlickChart.options.scales.y.ticks.color = getLabelColor();
  tailFlickChart.options.scales.y.title.color = getLabelColor();
  tailFlickChart.options.scales.y.grid.color = getGridColor();
  tailFlickChart.update();
});
</script>


<script src="{% static 'js/theme-toggle-v2.js' %}?v=28"></script>
</body>
</html>

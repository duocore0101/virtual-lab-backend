{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <script>(function(){const t=localStorage.getItem('gmars-theme-preference');if(t==='light')document.body.classList.add('light-mode');})();</script>
<meta charset="UTF-8">
<title>Dose Response Curve – Graph</title>

<link rel="stylesheet" href="{% static 'experiments/rotarod/css/experiment.css' %}?v=10001">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
    /* ================= BODY ================= */
    body {
        margin: 0;
        font-family: 'Poppins', sans-serif;
        background: #0f0f0f;
        color: white;
        transition: 0.3s ease;
    }

    body.light-mode {
        background: #f4f6f9;
        color: #111;
    }

    /* 🔝 TOP RIGHT FIXED ACTIONS */
    .top-actions {
        position: fixed;
        top: 20px;
        right: 20px;
        display: flex;
        align-items: center;
        gap: 12px;
        z-index: 9999;
        background: rgba(0, 0, 0, 0.2);
        padding: 5px 10px;
        border-radius: 30px;
        backdrop-filter: blur(5px);
        border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .top-actions .action-btn {
        padding: 8px 16px;
        border-radius: 20px;
        border: none;
        cursor: pointer;
        font-weight: 600;
        font-size: 12px;
        display: flex;
        align-items: center;
        gap: 6px;
        transition: all 0.25s ease;
        color: #fff;
        background: linear-gradient(135deg, #3b82f6, #1d4ed8);
        box-shadow: 0 4px 10px rgba(37, 99, 235, 0.3);
        white-space: nowrap;
    }

    .top-actions .action-btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 6px 15px rgba(37, 99, 235, 0.4);
    }

    /* 🎯 AIM HEADER ADJUSTMENT */
    .top-left-aim {
        position: fixed;
        top: 20px;
        left: 20px;
        max-width: 60%;
        z-index: 9998;
        background: rgba(0, 0, 0, 0.2);
        padding: 8px 15px;
        border-radius: 12px;
        backdrop-filter: blur(5px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        font-size: 13px;
    }

    /* ================= GRAPH CARD ================= */
    .graph-card {
        max-width: 1000px;
        margin: 80px auto 40px; /* Offset for header */
        padding: 35px;
        border-radius: 20px;
        position: relative;
        background: linear-gradient(#b9d8b9 1px, transparent 1px),
                    linear-gradient(90deg, #b9d8b9 1px, transparent 1px),
                    linear-gradient(#8fbf8f 2px, transparent 2px),
                    linear-gradient(90deg, #8fbf8f 2px, transparent 2px),
                    #dff3df;
        background-size: 20px 20px, 20px 20px, 100px 100px, 100px 100px;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        border: 8px solid #fff;
    }

    .graph-title {
        text-align: center;
        font-size: 28px;
        font-weight: 700;
        margin-bottom: 5px;
        color: #0a3d0a;
    }

    .graph-subtitle {
        text-align: center;
        margin-bottom: 25px;
        color: #145214;
        font-weight: 500;
    }

    /* ================= BUTTONS ================= */
    .button-row {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-top: 30px;
    }

    .back-btn, .next-btn {
        padding: 12px 30px;
        font-weight: 700;
        border-radius: 30px;
        cursor: pointer;
        transition: 0.3s;
        text-transform: uppercase;
        letter-spacing: 1px;
        font-size: 14px;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .back-btn {
        background: #fff;
        color: #ef4444;
        border: 2px solid #ef4444;
    }

    .back-btn:hover {
        background: #ef4444;
        color: #fff;
    }

    .next-btn {
        background: linear-gradient(135deg, #ef4444, #991b1b);
        color: #fff;
        border: none;
        box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
    }

    .next-btn:hover {
        transform: scale(1.05);
        box-shadow: 0 8px 20px rgba(239, 68, 68, 0.5);
    }

</style>
</head>

<body>
    <!-- 🎯 EXPERIMENT AIM HEADER -->
    <div class="top-left-aim">
        <span><b>Aim:</b> To study the effect of Physostigmine on the dose-response curve (DRC) of Acetylcholine using isolated frog rectus abdominis muscle.</span>
    </div>

    <!-- 🔝 TOP ACTIONS -->
    <div class="top-actions">
        <div id="theme-toggle-container"></div>
    </div>

    <div class="graph-card">
        <div class="graph-title">Log Dose Response Curve</div>
        <div class="graph-subtitle">Acetylcholine on Frog Rectus Abdominis (Effect of Physostigmine)</div>

        <canvas id="drcChart" height="120"></canvas>

        <div class="button-row">
            <button class="back-btn" onclick="location.href='/experiment/{{ experiment.slug }}/run/'">
                ⬅ Back
            </button>
            <button class="next-btn" onclick="location.href='/experiment/{{ experiment.slug }}/conclusion/'">
                Next ▶
            </button>
        </div>
    </div>

    <script>
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        }

        /* ================= DRC DATA ================= */
        const doses = [-1.30, -1.00, -0.70, -0.40, -0.10, 0.20];
        const ach = [10, 22, 43, 67, 88, 100];
        const physostigmine = [22, 46, 76, 95, 100, 100];

        const ctx = document.getElementById("drcChart").getContext("2d");

        new Chart(ctx, {
            type: "line",
            data: {
                labels: doses,
                datasets: [
                    {
                        label: "ACh",
                        data: ach,
                        borderColor: "#0b6623",
                        backgroundColor: "rgba(11,102,35,0.25)",
                        tension: 0.4,
                        pointRadius: 6,
                        pointBackgroundColor: "#064d1a",
                        fill: false
                    },
                    {
                        label: "ACh + Physostigmine",
                        data: physostigmine,
                        borderColor: "#2e8b57",
                        borderDash: [6, 6],
                        tension: 0.4,
                        pointRadius: 6,
                        pointBackgroundColor: "#1c5f3f",
                        fill: false
                    }
                ]
            },
            options: {
                plugins: {
                    legend: { display: true }
                },
                scales: {
                    x: {
                        title: {
                            display: true,
                            text: "Log Dose",
                            color: "#003d1f",
                            font: { weight: "bold" }
                        },
                        grid: { display: false }
                    },
                    y: {
                        beginAtZero: true,
                        max: 110,
                        title: {
                            display: true,
                            text: "Response (% Emax)",
                            color: "#003d1f",
                            font: { weight: "bold" }
                        },
                        grid: { display: false }
                    }
                }
            }
        });
    </script>

    <script src="{% static 'js/theme-toggle.js' %}?v=27"></script>
</body>
</html>

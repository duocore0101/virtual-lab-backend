{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <script>(function(){const t=localStorage.getItem('gmars-theme-preference');if(t==='light')document.body.classList.add('light-mode');})();</script>
  <meta charset="UTF-8">
  <title>Diuretic Activity Experiment – Aim</title>

  <!-- CSS (REUSED EXACTLY LIKE ROTAROD) -->
  <link rel="stylesheet"
        href="{% static 'experiments/rotarod/css/intro.css' %}">

  <style>
    /* 🔝 TOP RIGHT ACTIONS */
    .top-actions {
      position: fixed;
      top: 20px;
      right: 25px;
      display: flex;
      gap: 12px;
      z-index: 9999;
    }

    .top-actions button {
      padding: 10px 18px;
      border-radius: 22px;
      border: none;
      cursor: pointer;
      font-weight: 600;
      background: #ff2e2e;
      color: #fff;
      box-shadow: 0 0 14px rgba(255, 0, 0, 0.6);
      transition: transform 0.25s, box-shadow 0.25s;
    }

    .top-actions button:hover {
      transform: scale(1.08);
      box-shadow: 0 0 22px rgba(255, 0, 0, 0.9);
    }
  </style>
  {% if cached_model_path %}
  <!-- 🚀 PRELOAD 3D MODEL FOR INSTANT REQUIREMENTS PAGE -->
  <link rel="preload" href="{% static cached_model_path %}" as="fetch" crossorigin="anonymous">
  {% endif %}

  {% if cached_video_paths %}
  <!-- 🚀 PRELOAD VIDEOS TO PREVENT BUFFERING DURING EXPERIMENT -->
  {% for video_path in cached_video_paths %}
  <link rel="preload" href="{% static video_path %}" as="video" type="video/mp4">
  {% endfor %}
  {% endif %}
</head>

<body>

<!-- 🔝 TOP RIGHT BUTTONS -->
<div class="top-actions">
  
  
</div>

<div class="page-container">

  <!-- =========================
       TITLE (AIM ONLY)
  ========================== -->
  <h1 class="title">Aim</h1>

  <!-- =========================
       AIM TEXT
  ========================== -->
  <div class="info-box">
    <p style="font-size:18px; text-align:justify; font-weight:500;">
      To evaluate the diuretic activity of a given test drug by measuring
      urine output in rats / mice.
    </p>
  </div>

  <!-- =========================
       NAVIGATION BUTTONS
  ========================== -->
  <div class="button-row" style="justify-content:center;">
    <button class="back-btn"
      onclick="location.href='{{ dashboard_url }}'">
      ⬅ Back
    </button>

    <button class="exp-btn"
      onclick="location.href='/experiment/{{ experiment.slug }}/requirements/'">
      Next ▶
    </button>
  </div>

</div>

<!-- =========================
     🔧 SCRIPTS
========================== -->
<script>

</script>

<script>
function toggleFullscreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(err => {
      alert("Fullscreen not supported");
    });
  } else {
    document.exitFullscreen();
  }
}
</script>


<script src="{% static 'js/theme-toggle-v2.js' %}?v=27"></script>
</body>
</html>

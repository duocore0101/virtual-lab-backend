{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <script>(function(){const t=localStorage.getItem('gmars-theme-preference');if(t==='light')document.body.classList.add('light-mode');})();</script>
  <meta charset="UTF-8">
  <title>Result Graph – Hot Plate Method</title>

  <link rel="stylesheet"
        href="{% static 'experiments/rotarod/css/experiment.css' %}?v=20002">

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: radial-gradient(circle at top, #1a1a1a, #000000);
      color: #ffffff;
      transition: all 0.3s ease;
    }

    body.light-mode {
      background: #f4f6f9;
      color: #111;
    }

    .graph-card {
      max-width: 1000px;
      margin: 40px auto;
      background: linear-gradient(135deg, #0f0f0f, #1b1b1b);
      padding: 35px 40px;
      border-radius: 16px;
      box-shadow: 0 0 25px rgba(255, 0, 0, 0.35);
      transition: all 0.3s ease;
    }

    body.light-mode .graph-card {
      background: #ffffff;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }

    .graph-title {
      text-align: center;
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 5px;
      color: #ff4b4b;
    }

    body.light-mode .graph-title {
      color: #c62828;
    }

    .graph-subtitle {
      text-align: center;
      font-size: 18px;
      margin-bottom: 25px;
      color: #ddd;
    }

    body.light-mode .graph-subtitle {
      color: #555;
    }

    .theme-toggle {
      position: absolute;
      top: 20px;
      right: 30px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .toggle-switch {
      position: relative;
      width: 52px;
      height: 26px;
    }

    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: #555;
      border-radius: 34px;
      transition: 0.4s;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 20px;
      width: 20px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      border-radius: 50%;
      transition: 0.4s;
    }

    input:checked + .slider {
      background-color: #ff4b4b;
    }

    input:checked + .slider:before {
      transform: translateX(26px);
    }

    .toggle-label {
      font-size: 14px;
      color: #ccc;
    }

    body.light-mode .toggle-label {
      color: #333;
    }

    .fullscreen-btn {
      padding: 8px 14px;
      border-radius: 20px;
      border: none;
      cursor: pointer;
      font-weight: 600;
      background: #ff2e2e;
      color: #fff;
      box-shadow: 0 0 12px rgba(255, 0, 0, 0.6);
      transition: transform 0.25s, box-shadow 0.25s;
    }

    .fullscreen-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 0 18px rgba(255, 0, 0, 0.9);
    }

    .button-row {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 30px;
    }

    .button-row button {
      padding: 10px 28px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 30px;
      border: 2px solid #ff2a2a;
      background: transparent;
      color: #ff2a2a;
      cursor: pointer;
      transition: all 0.35s ease;
    }

    .button-row button:hover {
      background: linear-gradient(135deg, #ff2a2a, #8b0000);
      color: #ffffff;
      box-shadow: 0 0 15px rgba(255, 0, 0, 0.6);
    }
    
    /* 🎯 AIM HEADER LIGHT MODE FIX */
    body.light-mode .top-left-aim {
      background: rgba(0, 0, 0, 0.05) !important;
      color: #222 !important;
      border: 1px solid rgba(255, 0, 0, 0.3) !important;
    }
    
    body.light-mode .top-left-aim span {
      color: #222 !important;
    }
  </style>
</head>

<body>
  <!-- 🎯 EXPERIMENT AIM HEADER -->
  <div class="top-left-aim">
    <span><b>Aim:</b> To Study and Evaluate Analgesic Activity by Hot Plate Method</span>
  </div>

  <!-- 🔝 TOP RIGHT ACTIONS -->
  <div class="top-actions"></div>

<div class="graph-card">

  <div class="graph-title">Analgesic Activity (Hot Plate Method)</div>
  <div class="graph-subtitle">Reaction Time (seconds) vs Time (minutes)</div>

  <canvas id="resultChart" height="120"></canvas>

  <div class="button-row">
    <button onclick="location.href='/experiment/{{ experiment.slug }}/run/'">
      ⬅ Back
    </button>
    <button onclick="location.href='/experiment/{{ experiment.slug }}/conclusion/'">
      Next ▶
    </button>
  </div>

</div>



<script>
/* HOT PLATE GRAPH DATA */

const ctx = document.getElementById("resultChart").getContext("2d");

const getLabelColor = () => document.body.classList.contains("light-mode") ? "#444" : "#fff";
const getGridColor = () => document.body.classList.contains("light-mode") ? "#ddd" : "#444";

window.resultChart = new Chart(ctx, {
  type: "line",
  data: {
    labels: [0, 15, 30, 60, 90, 120],
    datasets: [
      {
        label: "Control",
        data: [6.4, 6.5, 6.7, 6.8, 6.4, 6.1],
        borderColor: "#1f77b4",
        backgroundColor: "#1f77b4",
        pointBackgroundColor: "#1f77b4",
        pointBorderColor: "#fff",
        pointRadius: 5,
        tension: 0,
        fill: false
      },
      {
        label: "Standard (Morphine)",
        data: [6.2, 10.3, 13.5, 14.5, 12.5, 9.8],
        borderColor: "#ff7f0e",
        backgroundColor: "#ff7f0e",
        pointBackgroundColor: "#ff7f0e",
        pointBorderColor: "#fff",
        pointRadius: 5,
        tension: 0,
        fill: false
      }
    ]
  },
  options: {
    responsive: true,
    plugins: {
      legend: {
        labels: { color: getLabelColor() }
      }
    },
    scales: {
      y: {
        beginAtZero: false,
        ticks: { color: getLabelColor() },
        grid: { color: getGridColor() },
        title: {
          display: true,
          text: "Reaction Time (seconds)",
          color: getLabelColor()
        }
      },
      x: {
        ticks: { color: getLabelColor() },
        grid: { color: getGridColor() },
        title: {
          display: true,
          text: "Time (minutes)",
          color: getLabelColor()
        }
      }
    }
  }
});

window.addEventListener('themeChanged', () => {
    const c = getLabelColor();
    const g = getGridColor();
    if (window.resultChart) {
        window.resultChart.options.plugins.legend.labels.color = c;
        window.resultChart.options.scales.x.ticks.color = c;
        window.resultChart.options.scales.y.ticks.color = c;
        window.resultChart.options.scales.x.title.color = c;
        window.resultChart.options.scales.y.title.color = c;
        window.resultChart.options.scales.x.grid.color = g;
        window.resultChart.options.scales.y.grid.color = g;
        window.resultChart.update();
    }
});
</script>


<script src="{% static 'js/theme-toggle-v2.js' %}?v=28"></script>
</body>
</html>

{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery - G MARS Pharma Solution</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=DM+Sans:wght@300;400;500&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --gold: #f4b400;
      --bg-dark: #05070f;
      --text-dark: #e8eaf0;
      --card-dark: #0c1222;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: var(--bg-dark);
      color: var(--text-dark);
      margin: 0;
      padding: 0;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 50px;
      background: #060b16;
    }

    .logo img {
      height: 150px;
    }

    .nav-links a {
      margin-left: 25px;
      text-decoration: none;
      color: inherit;
      font-weight: 500;
    }

    .gallery-section {
      padding: 80px 50px;
      text-align: center;
    }

    .gallery-header h1 {
      font-size: 40px;
      margin-bottom: 10px;
    }

    .gallery-header h1 span {
      color: var(--gold);
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      margin-top: 50px;
    }

    .gallery-item {
      background: var(--card-dark);
      border-radius: 15px;
      overflow: hidden;
      border: 1px solid rgba(244, 180, 0, 0.1);
      transition: 0.3s;
    }

    .gallery-item:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 20px rgba(244, 180, 0, 0.2);
    }

    .gallery-item img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      display: block;
    }

    /* HAMBURGER */
    .hamburger {
      display: none;
      font-size: 28px;
      cursor: pointer;
    }

    /* SIDEBAR */
    .sidebar {
      position: fixed;
      top: 0;
      right: -100%;
      width: 75%;
      max-width: 300px;
      height: 100vh;
      background: #0c1222;
      padding: 100px 30px;
      transition: 0.4s;
      z-index: 200;
    }

    .sidebar.active {
      right: 0;
    }

    .sidebar a {
      display: block;
      margin-bottom: 25px;
      font-size: 18px;
      color: #fff;
      text-decoration: none;
    }

    .sidebar-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      opacity: 0;
      visibility: hidden;
      transition: 0.3s;
      z-index: 150;
    }

    .sidebar-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    @media (max-width: 768px) {
      .navbar {
        padding: 15px 20px;
      }

      .logo img {
        height: 100px;
      }

      .nav-links {
        display: none;
      }

      .hamburger {
        display: block;
      }

      .gallery-section {
        padding: 40px 20px;
      }
    }
  </style>
</head>

<body>
  <div class="navbar">
    <div class="logo">
      <img src="{% static 'images/logo.png' %}" alt="Logo">
    </div>
    <div class="nav-links">
      <a href="{% url 'home' %}">Home</a>
      <a href="{% url 'features' %}">Features</a>
      <a href="{% url 'experiments' %}">Experiments</a>
      <a href="{% url 'pricing' %}">Pricing</a>
      <a href="{% url 'gallery' %}">Gallery</a>
      <a href="{% url 'about' %}">About</a>
      <a href="{% url 'about' %}#contact">Contact Us</a>
    </div>
    <div class="hamburger" onclick="toggleSidebar()">☰</div>
  </div>

  <!-- SIDEBAR -->
  <div class="sidebar" id="sidebar">
    <a href="{% url 'home' %}">🏠 Home</a>
    <a href="{% url 'features' %}">✨ Features</a>
    <a href="{% url 'experiments' %}">🧪 Experiments</a>
    <a href="{% url 'pricing' %}">💳 Pricing</a>
    <a href="{% url 'gallery' %}">🖼️ Gallery</a>
    <a href="{% url 'about' %}">👨‍💻 About</a>
    <a href="{% url 'about' %}#contact">📞 Contact Us</a>
  </div>

  <div class="sidebar-overlay" id="overlay" onclick="toggleSidebar()"></div>
  <section class="gallery-section">
    <div class="gallery-header">
      <h1>Our <span>Gallery</span></h1>
      <p>Visual highlights of our virtual pharmacology lab simulations.</p>
    </div>
    <div class="gallery-grid">
      <!-- Place real images in static/images/gallery/ and update these paths -->
      <div class="gallery-item"><img src="{% static 'images/gallery/image1.jpeg' %}" alt="Gallery Image 1"></div>
      <div class="gallery-item"><img src="{% static 'images/gallery/image2.jpeg' %}" alt="Gallery Image 2"></div>
      <div class="gallery-item"><img src="{% static 'images/gallery/image3.jpeg' %}" alt="Gallery Image 3"></div>
      <div class="gallery-item"><img src="{% static 'images/gallery/image4.jpeg' %}" alt="Gallery Image 4"></div>
      <div class="gallery-item"><img src="{% static 'images/gallery/image5.jpeg' %}" alt="Gallery Image 5"></div>
      <div class="gallery-item"><img src="{% static 'images/gallery/image6.jpeg' %}" alt="Gallery Image 6"></div>
      <div class="gallery-item"><img src="{% static 'images/gallery/image7.jpeg' %}" alt="Gallery Image 7"></div>
      <div class="gallery-item"><img src="{% static 'images/gallery/image8.jpeg' %}" alt="Gallery Image 8"></div>

    </div>
  </section>
  <script>
    function toggleSidebar() {
      document.getElementById("sidebar").classList.toggle("active");
      document.getElementById("overlay").classList.toggle("active");
    }
  </script>
</body>

</html>
